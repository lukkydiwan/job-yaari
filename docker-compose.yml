version: '3.8'

services:

  # Laravel App (PHP + Nginx)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobyaari_app
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      APP_NAME: "JobYaari Blog"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: jobyaari_blog
      DB_USERNAME: jobyaari
      DB_PASSWORD: secret
    volumes:
      - storage_data:/var/www/storage/app/public
    depends_on:
      db:
        condition: service_healthy
    networks:
      - jobyaari_net

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: jobyaari_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: jobyaari_blog
      MYSQL_USER: jobyaari
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootsecret"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - jobyaari_net

  # phpMyAdmin (optional DB GUI)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: jobyaari_pma
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_USER: jobyaari
      PMA_PASSWORD: secret
    depends_on:
      - db
    networks:
      - jobyaari_net

volumes:
  db_data:
  storage_data:

networks:
  jobyaari_net:
    driver: bridge
